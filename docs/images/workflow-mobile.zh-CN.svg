<svg xmlns="http://www.w3.org/2000/svg" width="780" height="2122" viewBox="0 0 780 2122" role="img" aria-labelledby="title desc">
<title id="title">OpenEval：独立任务入口，共享版本上下文。</title>
<desc id="desc">共建标准、构建评测集、评测已有产物、分析已有评分或撰写报告。选定版本交给 Codex CLI 执行，保留可追溯产物；需要报告时优先使用所选模板。目标完成与独立验收分别记录。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#6c8460" stroke-width="1.1" /></marker></defs>
<rect x="0" y="0" width="780" height="2122" rx="0" fill="#f7f8f6" />
<text x="48" y="65" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="500" fill="#60645f" letter-spacing="1">五个独立入口，一个工作区。</text><text x="48" y="141" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="49" font-weight="620" fill="#202020">从你手头的</text><text x="48" y="205" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="49" font-weight="620" fill="#202020">工作开始。</text><text x="48" y="274" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="500" fill="#60645f" letter-spacing="1">选择本次任务入口</text><rect x="48" y="306" width="684" height="416" rx="12" fill="#ffffff" stroke="#d8ddd6" stroke-width="2" /><rect x="76" y="349" width="11" height="11" rx="2" fill="#87ea5c" /><text x="108" y="369" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="500" fill="#202020">共建评测标准</text><line x1="76" y1="396" x2="704" y2="396" stroke="#d8ddd6" stroke-width="2" /><rect x="76" y="421" width="11" height="11" rx="2" fill="#87ea5c" /><text x="108" y="441" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="500" fill="#202020">构建评测集</text><line x1="76" y1="468" x2="704" y2="468" stroke="#d8ddd6" stroke-width="2" /><rect x="76" y="493" width="11" height="11" rx="2" fill="#87ea5c" /><text x="108" y="513" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="500" fill="#202020">评测已有产物</text><line x1="76" y1="540" x2="704" y2="540" stroke="#d8ddd6" stroke-width="2" /><rect x="76" y="565" width="11" height="11" rx="2" fill="#87ea5c" /><text x="108" y="585" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="500" fill="#202020">分析已有评分</text><line x1="76" y1="612" x2="704" y2="612" stroke="#d8ddd6" stroke-width="2" /><rect x="76" y="637" width="11" height="11" rx="2" fill="#87ea5c" /><text x="108" y="657" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="500" fill="#202020">撰写报告</text><text x="76" y="697" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#60645f">按需选择，各入口相互独立。</text><line x1="390" y1="722" x2="390" y2="774" stroke="#6c8460" stroke-width="2" marker-end="url(#arrow)" /><rect x="48" y="786" width="684" height="204" rx="12" fill="#f0f7eb" stroke="#d8ddd6" stroke-width="2" /><text x="80" y="842" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="42" font-weight="600" fill="#202020">固定版本上下文</text><text x="80" y="892" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="29" font-weight="400" fill="#60645f">标准 · 评测集 · 已有产物</text><text x="80" y="935" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="29" font-weight="400" fill="#60645f">评分 · 技能 · 模板</text><text x="80" y="970" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="500" fill="#202020">固定版本 ID 与内容哈希</text><line x1="390" y1="990" x2="390" y2="1043" stroke="#6c8460" stroke-width="2" marker-end="url(#arrow)" /><rect x="48" y="1054" width="684" height="244" rx="12" fill="#202020" /><text x="80" y="1116" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="48" font-weight="600" fill="#ffffff">Codex CLI</text><text x="80" y="1164" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="29" font-weight="400" fill="#cbd0c8">使用 ChatGPT 账号登录</text><line x1="80" y1="1186" x2="700" y2="1186" stroke="#4a5046" stroke-width="2" /><text x="80" y="1233" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="500" fill="#ffffff">单轮任务</text><text x="389" y="1233" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="500" fill="#87ea5c">原生目标*</text><text x="80" y="1275" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="400" fill="#cbd0c8">命令 · 事件 · 审批</text><line x1="390" y1="1298" x2="390" y2="1351" stroke="#6c8460" stroke-width="2" marker-end="url(#arrow)" /><rect x="48" y="1362" width="684" height="200" rx="12" fill="#ffffff" stroke="#d8ddd6" stroke-width="2" /><text x="80" y="1421" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="42" font-weight="600" fill="#202020">可追溯的版本产物</text><text x="80" y="1471" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="29" font-weight="400" fill="#60645f">标准 · 评测集 · 结果</text><text x="80" y="1516" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="29" font-weight="400" fill="#60645f">分析 · 文件 · 报告</text><line x1="390" y1="1562" x2="390" y2="1643" stroke="#6c8460" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)" /><rect x="267" y="1582" width="246" height="34" rx="0" fill="#f7f8f6" /><text x="285" y="1608" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="500" fill="#60645f">按需生成报告</text><rect x="48" y="1654" width="684" height="152" rx="12" fill="#ffffff" stroke="#d8ddd6" stroke-width="2" /><text x="80" y="1715" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="43" font-weight="600" fill="#202020">报告</text><text x="80" y="1771" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="500" fill="#202020">优先使用你选定的模板。</text><text x="48" y="1864" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="400" fill="#60645f">* 原生目标以当前 CLI 支持为准。</text><rect x="48" y="1902" width="684" height="128" rx="4" fill="#202020" /><text x="80" y="1954" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="500" fill="#ffffff">目标完成 ≠ 验收通过。</text><text x="80" y="1999" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="400" fill="#d9ddd6">检查证据，验收后交付。</text><text x="48" y="2080" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="400" fill="#60645f" letter-spacing="0.6">工作流程示意 · 非产品界面截图</text>
</svg>