<svg xmlns="http://www.w3.org/2000/svg" width="780" height="2122" viewBox="0 0 780 2122" role="img" aria-labelledby="title desc">
<title id="title">OpenEval: independent entry points, shared context.</title>
<desc id="desc">Build standards, build datasets, evaluate existing outputs, analyze existing scores, or write reports. Selected versions feed Codex CLI execution. Keep versioned artifacts and create reports with the user's template when requested. Goal completion is separate from acceptance.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#6c8460" stroke-width="1.1"/></marker></defs>
<rect x="0" y="0" width="780" height="2122" rx="0" fill="#f7f8f6"/>
<text x="48" y="65" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="22" font-weight="500" fill="#60645f" letter-spacing="1">FIVE WAYS IN. ONE WORKSPACE.</text><text x="48" y="141" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="49" font-weight="620" fill="#202020">Start with the work</text><text x="48" y="205" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="49" font-weight="620" fill="#202020">you have.</text><text x="48" y="274" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="22" font-weight="500" fill="#60645f" letter-spacing="1">CHOOSE A STARTING POINT</text><rect x="48" y="306" width="684" height="416" rx="12" fill="#ffffff" stroke="#d8ddd6" stroke-width="2"/><rect x="76" y="349" width="11" height="11" rx="2" fill="#87ea5c"/><text x="108" y="369" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="32" font-weight="500" fill="#202020">Build standards</text><line x1="76" y1="396" x2="704" y2="396" stroke="#d8ddd6" stroke-width="2"/><rect x="76" y="421" width="11" height="11" rx="2" fill="#87ea5c"/><text x="108" y="441" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="32" font-weight="500" fill="#202020">Build datasets</text><line x1="76" y1="468" x2="704" y2="468" stroke="#d8ddd6" stroke-width="2"/><rect x="76" y="493" width="11" height="11" rx="2" fill="#87ea5c"/><text x="108" y="513" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="32" font-weight="500" fill="#202020">Evaluate existing outputs</text><line x1="76" y1="540" x2="704" y2="540" stroke="#d8ddd6" stroke-width="2"/><rect x="76" y="565" width="11" height="11" rx="2" fill="#87ea5c"/><text x="108" y="585" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="32" font-weight="500" fill="#202020">Analyze existing scores</text><line x1="76" y1="612" x2="704" y2="612" stroke="#d8ddd6" stroke-width="2"/><rect x="76" y="637" width="11" height="11" rx="2" fill="#87ea5c"/><text x="108" y="657" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="32" font-weight="500" fill="#202020">Write reports</text><text x="76" y="697" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="24" font-weight="400" fill="#60645f">Independent tasks, not a checklist.</text><line x1="390" y1="722" x2="390" y2="774" stroke="#6c8460" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="786" width="684" height="204" rx="12" fill="#f0f7eb" stroke="#d8ddd6" stroke-width="2"/><text x="80" y="842" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="42" font-weight="600" fill="#202020">Versioned context</text><text x="80" y="892" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="29" font-weight="400" fill="#60645f">Standards · datasets · outputs</text><text x="80" y="935" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="29" font-weight="400" fill="#60645f">Scores · skills · templates</text><text x="80" y="970" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="24" font-weight="500" fill="#202020">Pinned version ID + hash</text><line x1="390" y1="990" x2="390" y2="1043" stroke="#6c8460" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="1054" width="684" height="244" rx="12" fill="#202020"/><text x="80" y="1116" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="48" font-weight="600" fill="#ffffff">Codex CLI</text><text x="80" y="1164" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="29" font-weight="400" fill="#cbd0c8">ChatGPT account sign-in</text><line x1="80" y1="1186" x2="700" y2="1186" stroke="#4a5046" stroke-width="2"/><text x="80" y="1233" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="32" font-weight="500" fill="#ffffff">Single turn</text><text x="389" y="1233" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="32" font-weight="500" fill="#87ea5c">Native goal*</text><text x="80" y="1275" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="26" font-weight="400" fill="#cbd0c8">Commands · events · approvals</text><line x1="390" y1="1298" x2="390" y2="1351" stroke="#6c8460" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="1362" width="684" height="200" rx="12" fill="#ffffff" stroke="#d8ddd6" stroke-width="2"/><text x="80" y="1421" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="42" font-weight="600" fill="#202020">Versioned artifacts</text><text x="80" y="1471" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="29" font-weight="400" fill="#60645f">Standards · datasets · results</text><text x="80" y="1516" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="29" font-weight="400" fill="#60645f">Analysis · files · reports</text><line x1="390" y1="1562" x2="390" y2="1643" stroke="#6c8460" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/><rect x="267" y="1582" width="246" height="34" rx="0" fill="#f7f8f6"/><text x="285" y="1608" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="25" font-weight="500" fill="#60645f">When requested</text><rect x="48" y="1654" width="684" height="152" rx="12" fill="#ffffff" stroke="#d8ddd6" stroke-width="2"/><text x="80" y="1715" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="43" font-weight="600" fill="#202020">Reports</text><text x="80" y="1771" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="32" font-weight="500" fill="#202020">Your template first.</text><text x="48" y="1864" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="25" font-weight="400" fill="#60645f">* Native goal availability follows the CLI.</text><rect x="48" y="1902" width="684" height="128" rx="4" fill="#202020"/><text x="80" y="1954" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="30" font-weight="500" fill="#ffffff">Goal complete ≠ acceptance passed.</text><text x="80" y="1999" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif" font-size="27" font-weight="400" fill="#d9ddd6">Inspect. Verify. Then deliver.</text><text x="48" y="2080" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="19" font-weight="400" fill="#60645f" letter-spacing="0.6">WORKFLOW ILLUSTRATION · NOT PRODUCT UI</text>
</svg>