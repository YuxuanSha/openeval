<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1164" viewBox="0 0 1600 1164" role="img" aria-labelledby="title desc">
<title id="title">OpenEval：独立任务入口，共享版本上下文。</title>
<desc id="desc">共建标准、构建评测集、评测已有产物、分析已有评分或撰写报告。选定版本交给 Codex CLI 执行，保留可追溯产物；需要报告时优先使用所选模板。目标完成与独立验收分别记录。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#6c8460" stroke-width="1.1" /></marker></defs>
<rect x="0" y="0" width="1600" height="1164" rx="0" fill="#f7f8f6" />
<text x="80" y="78" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="500" fill="#60645f" letter-spacing="1.8">五个独立入口，一个共享工作区。</text><text x="80" y="165" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="65" font-weight="620" fill="#202020">从你手头的工作开始。</text><line x1="80" y1="210" x2="1520" y2="210" stroke="#d8ddd6" stroke-width="2" /><text x="80" y="258" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="500" fill="#60645f" letter-spacing="1">选择本次任务入口</text><rect x="80" y="286" width="400" height="490" rx="12" fill="#ffffff" stroke="#d8ddd6" stroke-width="2" /><line x1="530" y1="346" x2="530" y2="714" stroke="#6c8460" stroke-width="2" /><line x1="530" y1="346" x2="585" y2="346" stroke="#6c8460" stroke-width="2" marker-end="url(#arrow)" /><rect x="104" y="330" width="10" height="10" rx="2" fill="#87ea5c" /><text x="131" y="350" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="500" fill="#202020">共建评测标准</text><line x1="480" y1="346" x2="530" y2="346" stroke="#6c8460" stroke-width="2" /><line x1="104" y1="388" x2="456" y2="388" stroke="#d8ddd6" stroke-width="2" /><rect x="104" y="422" width="10" height="10" rx="2" fill="#87ea5c" /><text x="131" y="442" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="500" fill="#202020">构建评测集</text><line x1="480" y1="438" x2="530" y2="438" stroke="#6c8460" stroke-width="2" /><line x1="104" y1="480" x2="456" y2="480" stroke="#d8ddd6" stroke-width="2" /><rect x="104" y="514" width="10" height="10" rx="2" fill="#87ea5c" /><text x="131" y="534" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="500" fill="#202020">评测已有产物</text><line x1="480" y1="530" x2="530" y2="530" stroke="#6c8460" stroke-width="2" /><line x1="104" y1="572" x2="456" y2="572" stroke="#d8ddd6" stroke-width="2" /><rect x="104" y="606" width="10" height="10" rx="2" fill="#87ea5c" /><text x="131" y="626" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="500" fill="#202020">分析已有评分</text><line x1="480" y1="622" x2="530" y2="622" stroke="#6c8460" stroke-width="2" /><line x1="104" y1="664" x2="456" y2="664" stroke="#d8ddd6" stroke-width="2" /><rect x="104" y="698" width="10" height="10" rx="2" fill="#87ea5c" /><text x="131" y="718" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="500" fill="#202020">撰写报告</text><line x1="480" y1="714" x2="530" y2="714" stroke="#6c8460" stroke-width="2" /><text x="82" y="823" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="400" fill="#60645f">按需选择，各入口相互独立。</text><rect x="590" y="286" width="420" height="202" rx="12" fill="#f0f7eb" stroke="#d8ddd6" stroke-width="2" /><text x="620" y="336" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="37" font-weight="600" fill="#202020">固定版本上下文</text><text x="620" y="385" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#60645f">标准 · 评测集 · 已有产物</text><text x="620" y="423" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#60645f">评分 · 技能 · 模板</text><text x="620" y="460" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="500" fill="#202020">固定版本 ID 与内容哈希</text><line x1="800" y1="488" x2="800" y2="536" stroke="#6c8460" stroke-width="2" marker-end="url(#arrow)" /><rect x="590" y="544" width="420" height="232" rx="12" fill="#202020" /><text x="620" y="599" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="45" font-weight="600" fill="#ffffff">Codex CLI</text><text x="620" y="640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#cbd0c8">使用 ChatGPT 账号登录</text><line x1="620" y1="660" x2="980" y2="660" stroke="#4a5046" stroke-width="2" /><text x="620" y="704" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="500" fill="#ffffff">单轮任务</text><text x="809" y="704" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="500" fill="#87ea5c">原生目标*</text><text x="620" y="746" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="400" fill="#cbd0c8">命令 · 事件 · 审批</text><line x1="1010" y1="659" x2="1060" y2="659" stroke="#6c8460" stroke-width="2" /><line x1="1060" y1="659" x2="1060" y2="403" stroke="#6c8460" stroke-width="2" /><line x1="1060" y1="403" x2="1104" y2="403" stroke="#6c8460" stroke-width="2" marker-end="url(#arrow)" /><text x="1110" y="258" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="500" fill="#60645f" letter-spacing="1">保留执行证据</text><rect x="1110" y="286" width="410" height="244" rx="12" fill="#ffffff" stroke="#d8ddd6" stroke-width="2" /><text x="1140" y="343" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="600" fill="#202020">可追溯的版本产物</text><text x="1140" y="397" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="400" fill="#60645f">标准 · 评测集 · 结果</text><text x="1140" y="435" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="400" fill="#60645f">分析 · 文件 · 报告</text><text x="1140" y="488" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="500" fill="#202020">保留来源与执行上下文</text><line x1="1315" y1="530" x2="1315" y2="624" stroke="#6c8460" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)" /><rect x="1202" y="559" width="226" height="32" rx="0" fill="#f7f8f6" /><text x="1221" y="583" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="500" fill="#60645f">按需生成报告</text><rect x="1110" y="635" width="410" height="141" rx="12" fill="#ffffff" stroke="#d8ddd6" stroke-width="2" /><text x="1140" y="686" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="38" font-weight="600" fill="#202020">报告</text><text x="1140" y="734" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="500" fill="#202020">优先使用你选定的模板。</text><line x1="80" y1="892" x2="1520" y2="892" stroke="#d8ddd6" stroke-width="2" /><text x="80" y="943" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="400" fill="#60645f">* 原生目标以当前 CLI 支持为准。</text><rect x="80" y="980" width="1440" height="80" rx="4" fill="#202020" /><text x="114" y="1032" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="500" fill="#ffffff">目标完成 ≠ 验收通过。</text><text x="995" y="1032" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="400" fill="#d9ddd6">检查证据，验收后交付。</text><text x="80" y="1115" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="400" fill="#60645f" letter-spacing="1">工作流程示意 · 非产品界面截图</text>
</svg>